name: Validate repository

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up CPython 3.14.7
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.7
          architecture: x64
      - name: Set up Node.js 24.21.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          architecture: x64
          package-manager-cache: false
      - name: Install checksum-verified PowerShell 7.6.6
        run: bash .github/scripts/install-powershell.sh
      - name: Validate repository and package manifests
        run: python scripts/validate_repository.py
      - name: Run maintainer doctor
        env:
          WAYFINDER_NODE_RUNTIME: node
          WAYFINDER_POWERSHELL_RUNTIME: pwsh
        run: python plugins/wayfinder-maintainer/skills/wayfinder-maintainer/scripts/maintain.py doctor
      - name: Run canonical maintainer regressions
        env:
          WAYFINDER_NODE_RUNTIME: node
          WAYFINDER_POWERSHELL_RUNTIME: pwsh
        run: python plugins/wayfinder-maintainer/skills/wayfinder-maintainer/scripts/maintain.py self-test
      - name: Run all registered adapters against the common suite
        env:
          WAYFINDER_NODE_RUNTIME: node
          WAYFINDER_POWERSHELL_RUNTIME: pwsh
        run: |
          python plugins/wayfinder-maintainer/skills/wayfinder-maintainer/scripts/maintain.py test --adapter python-reference-v1
          python plugins/wayfinder-maintainer/skills/wayfinder-maintainer/scripts/maintain.py test --adapter node-v1
          python plugins/wayfinder-maintainer/skills/wayfinder-maintainer/scripts/maintain.py test --adapter powershell-v1
