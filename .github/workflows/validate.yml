name: Validate repository

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Record verification start
        run: echo "WAYFINDER_VERIFICATION_STARTED=$(date +%s.%N)" >> "$GITHUB_ENV"
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up CPython 3.14.7
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.7
          architecture: x64
      - name: Set up Node.js 24.21.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          architecture: x64
          package-manager-cache: false
      - name: Install checksum-verified PowerShell 7.6.6
        run: bash .github/scripts/install-powershell.sh
      - name: Profile costly conformance fixtures
        timeout-minutes: 10
        env:
          WAYFINDER_NODE_RUNTIME: node
          WAYFINDER_POWERSHELL_RUNTIME: pwsh
        run: python scripts/profile_conformance_costs.py --output "$RUNNER_TEMP/conformance-cost-profile"
      - name: Run full ordinary repository verification with timings
        if: always()
        env:
          WAYFINDER_NODE_RUNTIME: node
          WAYFINDER_POWERSHELL_RUNTIME: pwsh
        # Two workers accompany this diagnostic checkpoint; no final count is selected.
        run: python scripts/run_repository_verification.py --powershell-jobs 2 --output "$RUNNER_TEMP/verification-timings"
