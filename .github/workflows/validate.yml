name: Validate repository

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Record verification start
        run: echo "WAYFINDER_VERIFICATION_STARTED=$(date +%s.%N)" >> "$GITHUB_ENV"
      - name: Check out exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up CPython 3.14.7
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.7
          architecture: x64
      - name: Set up Node.js 24.21.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          architecture: x64
          package-manager-cache: false
      - name: Install checksum-verified PowerShell 7.6.6
        run: bash .github/scripts/install-powershell.sh
      - name: Run full ordinary repository verification with timings
        env:
          WAYFINDER_NODE_RUNTIME: node
          WAYFINDER_POWERSHELL_RUNTIME: pwsh
          # Temporary same-revision baseline comparison: rerun attempts 1/2/3 use 1/2/4.
          # Replace with the selected fixed worker count after the measurement checkpoint.
          WAYFINDER_PERFORMANCE_BENCHMARK: 'true'
        run: |
          jobs=2
          if [ "$WAYFINDER_PERFORMANCE_BENCHMARK" = true ]; then
            case "$GITHUB_RUN_ATTEMPT" in
              1) jobs=1 ;;
              2) jobs=2 ;;
              3) jobs=4 ;;
            esac
          fi
          python scripts/run_repository_verification.py --powershell-jobs "$jobs" --output "$RUNNER_TEMP/verification-timings"
