name: Reproduce adapter parity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.7
          architecture: x64
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          architecture: x64
          package-manager-cache: false
      - run: bash .github/scripts/install-powershell.sh
      - name: Reproduce complete common-suite parity
        env:
          WAYFINDER_NODE_RUNTIME: node
          WAYFINDER_POWERSHELL_RUNTIME: pwsh
        run: python plugins/wayfinder-maintainer/skills/wayfinder-maintainer/scripts/maintain.py parity --output parity-output
      - name: Upload reproducibility report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: parity-reproduction-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: parity-output/
          if-no-files-found: error
          retention-days: 30
