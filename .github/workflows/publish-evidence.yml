name: Prepare approved evidence release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Approved certification workflow run ID
        required: true
        type: string
      source_commit:
        description: Exact approved source commit SHA
        required: true
        type: string
      run_attempt:
        description: Exact approved certification workflow run attempt
        required: true
        type: string
      matrix_sha256:
        description: Exact approved aggregate matrix SHA-256
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  prepare:
    environment: evidence-publication
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require exact approved revision-10 identity
        env:
          APPROVED_RUN_ID: ${{ inputs.run_id }}
          APPROVED_RUN_ATTEMPT: ${{ inputs.run_attempt }}
          APPROVED_SOURCE_COMMIT: ${{ inputs.source_commit }}
          APPROVED_MATRIX_SHA256: ${{ inputs.matrix_sha256 }}
        shell: bash
        run: |
          test "$APPROVED_RUN_ID" = "34921918384"
          test "$APPROVED_RUN_ATTEMPT" = "1"
          test "$APPROVED_SOURCE_COMMIT" = "82a2bb994e7ef8d2ffda7317e0687b0c7230aa54"
          test "$APPROVED_MATRIX_SHA256" = "2cc501f45a238d3d6161a89890a33d28fe20aa750558d278d0a69d10bb34a2d0"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.14.7
          architecture: x64
      - name: Download exact approved run
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          pattern: wayfinder-*
          path: approved-evidence
          merge-multiple: true
      - name: Re-verify and bind publication manifest
        run: >-
          python scripts/prepare_evidence_release.py
          --input approved-evidence
          --expected-commit "${{ inputs.source_commit }}"
          --expected-run-id "${{ inputs.run_id }}"
          --expected-attempt "${{ inputs.run_attempt }}"
          --expected-matrix-sha256 "${{ inputs.matrix_sha256 }}"
          --output publication
      - name: Create draft evidence release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVIDENCE_TAG: evidence-v1-candidate-revision-10-${{ inputs.matrix_sha256 }}
        shell: bash
        run: |
          gh release create "$EVIDENCE_TAG" \
            --draft \
            --target "${{ inputs.source_commit }}" \
            --title "Wayfinder candidate revision 10 bounded matrix evidence" \
            --notes "Exact run 34921918384 attempt 1 bounded eight-entry candidate-revision-10 matrix evidence. Maintainer-run, not independent or full-family certification; no release-certification entry, runtime-guidance change, or activation authority."
          find approved-evidence publication -type f -print0 | while IFS= read -r -d '' file; do
            gh release upload "$EVIDENCE_TAG" "$file"
          done
